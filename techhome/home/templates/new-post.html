{% extends 'base.html'%}
{% load static %}
{% block title%} Post an article {% endblock title%}
{% block content%}

<div class="col-lg-6 offset-lg-3 form-group">
      <h3>Post an article</h3>
      <form method='POST' enctype="multipart/form-data">
        {% csrf_token %}
          <span class="ml-2"></span>
          {{ form.as_p }}
        <button class="btn btn-primary ml-2"> Post </button>
      </form>
    </div>

{%endblock content%}
