{% extends 'base.html'%}
{% load static %}
{%block title%} Edit Profile {%endblock title%}
{% block content%}
{% if user.is_authenticated%}
<div class="col-lg-6 offset-lg-3 form-group">
      <h3>Edit Profile</h3>
      <form method='POST' enctype="multipart">
        {% csrf_token %}
          <span class="ml-2"></span>

          {{ form.as_p }}
        <button class="btn btn-primary ml-2"> Update profile </button>
      </form>
    <br>
    <h6>Forget your password? <a href="{%url 'password'%}"> Change Password</a></h6>
    </div>


{%endif%}
{%endblock content%}
