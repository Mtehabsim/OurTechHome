{% extends 'base.html'%}
{% load static %}
{% block title%} create a profile {% endblock title%}
{% block content%}
{% if user.profile.pk %}
<meta http-equiv="REFRESH" content="0;url=http://127.0.0.1:8000/">
{%else%}
<div class="col-lg-6 offset-lg-3 form-group">
      <h3>Register</h3>
      <form method='POST' enctype="multipart/form-data">
        {% csrf_token %}
          <span class="ml-2"></span>
          {{ form.as_p }}
        <button class="btn btn-primary ml-2"> Create profile </button>
      </form>
    </div>
{%endif%}
{%endblock content%}
