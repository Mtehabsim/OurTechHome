{% extends 'base.html'%}
{% load static %}
{% block content%}


<div class="col-lg-6 offset-lg-3 form-group">
      <h3>Set new password</h3>
    <p>Enter your new password twice to verify</p>
      <form method='POST'>
        {% csrf_token %}
          <span class="ml-2"></span>
          {{ form}}
        <button type="submit" name="Update Password" class="btn btn-primary ml-2"> Update </button>
      </form>

    </div>


{%endblock content%}
